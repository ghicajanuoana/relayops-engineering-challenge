map $http_x_request_id $relayops_request_id {
    default $http_x_request_id;
    "" $request_id;
}

log_format relayops escape=json
    '{"request_id":"$relayops_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream_status":"$upstream_status"}';

upstream relayops_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log relayops;

    # Include IDs on upstream and gateway-generated errors, without duplicates.
    add_header X-Request-ID $relayops_request_id always;
    proxy_hide_header X-Request-ID;

    # Allow a 1 MB payload plus the surrounding event JSON.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $relayops_request_id;

    location / {
        proxy_pass http://relayops_api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /events {
        proxy_pass http://relayops_api;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
